{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="{% static "css/menu.css" %}">
</head>
<body>
    <div class="content">
        <div class="container">
            <h1 class="text-center">TODAY MENU</h1>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ITEM NAME</th>
                            <th>PRICE</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for x in menu %}
                        <tr>
                            <td>{{ x.add_item }}</td>
                            {% if x.add_item %}
                                <td>{{ x.add_item.price }}</td>
                            {% else %}
                                <td>Not available</td>  
                            {% endif %}
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <a href="{% url 'home' %}" class="btn btn-danger">Back to Home</a>
        </div>
    </div>
</body>
</html>
