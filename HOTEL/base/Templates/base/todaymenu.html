{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today Menu</title>
    <link rel="stylesheet" href="{% static 'css/todaymenu.css' %}">
</head>
<body>
    {% include "Asidenav.html" %}
    <form method="post" action="{% url 'today_menu' %}">
        {% csrf_token %}
        <label for="food_items">Select items:</label>
        <select name="item_name" id="food_items">
            {% for item in food_items %}
                <option value="{{ item.item_name }}">{{ item.item_name }}</option>
            {% endfor %}
        </select>
        <button type="button" class="btn btn-danger" id="btn1" name="btn1">Add food</button>
    </form>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        $(document).ready(function() {
            $('#btn1').click(function() {
                var food_items = $('#food_items').val();
                var data = {
                    'csrfmiddlewaretoken': '{{ csrf_token }}',
                    'item_name': food_items
                };

                if (food_items == "") {
                    alert("Please select an item");
                } else {
                    $.ajax({
                        url: '{% url "today_menu" %}',
                        method: 'POST',
                        data: data,
                        success: function(response) {
                            if (response.success) {
                                alert(response.message);
                            } else {
                                alert(response.message);
                            }
                        },
                        error: function(xhr, errmsg, err) {
                            console.log(xhr.status + ": " + xhr.responseText); // Log any errors to console
                            alert("Error occurred. Please try again.");
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
